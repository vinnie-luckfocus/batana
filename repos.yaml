  #   batana-core: v0.2.0
  #   batana-gui: v0.3.0
  #   batana-cap: { software: v0.1.0, hardware: cap-evt2 }
  #   contracts: { session-schema: "1.0", ble-protocol: "1.0" }
  #   models: { pose2d: "1.3.0" }   # 只引用 batana-core models/registry.yaml，不复制
