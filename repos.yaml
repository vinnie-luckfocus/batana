# Batana 生态仓库清单与版本兼容矩阵（唯一权威登记处）
# 维护规则：子仓发版 / 契约变更后必须更新本文件。详见 docs/versioning.md
meta:
  updated: "2026-09-17"
  schema: 1

repos:
  batana:
    role: 司令塔（产品定义 / 版本 / 进度 / 素材 / 契约索引）
    url: https://github.com/vinnie-luckfocus/batana
    version: v0.1.0
    status: active
    progress: 10
  batana-core:
    role: 模型系统核心（管线 / 算子 / 推理运行时 / 训练）
    url: https://github.com/vinnie-luckfocus/batana-core
    version: null
    status: planning
    progress: 0
    defines_contracts: [session-schema, capabilities]
  batana-app:
    role: 跨平台移动/桌面应用（Flutter：iOS / Android / macOS / Windows）
    url: https://github.com/vinnie-luckfocus/batana-app
    version: null
    status: planning
    progress: 0
  batana-gui:
    role: 嵌入式 GUI（Qt6/QML，batana-pi 显示屏本地界面）
    url: https://github.com/vinnie-luckfocus/batana-gui
    version: null
    status: planning
    progress: 0
  batana-pi:
    role: 双目边缘计算设备（硬件 + 采集服务 + 系统镜像）
    url: https://github.com/vinnie-luckfocus/batana-pi
    version: null
    status: planning
    progress: 0
  batana-cap:
    role: 棒尾 IMU 传感器（硬件 + Zephyr 固件）
    url: https://github.com/vinnie-luckfocus/batana-cap
    version: null
    status: planning
    progress: 0
    defines_contracts: [ble-protocol]
  batana-web:
    role: Web 管理平台（统计 / 趋势 / 多用户数仓）
    url: https://github.com/vinnie-luckfocus/batana-web
    version: null
    status: planning
    progress: 0
    defines_contracts: [sync-api]

contracts:
  # 版本写法：草案期 1.0-draft，固化后 1.0（详见 docs/versioning.md）
  session-schema:    { version: "1.0", owner: batana-core, consumers: [batana-app, batana-gui, batana-pi, batana-web] }
  capabilities:      { version: "1.0", owner: batana-core, consumers: [batana-app, batana-gui, batana-web] }
  ble-protocol:      { version: "1.0", owner: batana-cap,  consumers: [batana-app, batana-pi] }
  sync-api:          { version: "1.0", owner: batana-web,  consumers: [batana-app, batana-pi] }
  runtime-api:       { version: planned, owner: batana-core, consumers: [batana-app, batana-gui, batana-pi] }   # P1 随 runtime v0.1 落地
  device-interfaces: { version: 1.0-draft, owner: batana-pi,   consumers: [batana-core, batana-gui] } # 含 calibration-data

# 产品组合快照：各仓版本 + 契约 + 模型工件的合法搭配（准入条件见 docs/versioning.md 第 3 节）
combos: {}
